        app.kubernetes.io/name: internal-ingress
        app.kubernetes.io/part-of: internal-ingress
        app.kubernetes.io/version: 1.13.3
      name: internal-ingress-admission-create
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - create
        - --host=internal-ingress-controller-admission,internal-ingress-controller-admission.$(POD_NAMESPACE).svc
        - --namespace=$(POD_NAMESPACE)
        - --secret-name=internal-ingress-admission
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.6.3@sha256:3d671cf20a35cd94efc5dcd484970779eb21e7938c98fbc3673693b8a117cf39
        imagePullPolicy: IfNotPresent
        name: create
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: OnFailure
      serviceAccountName: internal-ingress-admission
  ttlSecondsAfterFinished: 0
